<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    #three-app-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #render-stats {
      position: fixed;
      top: 0;
      left: 0;
      background: black;
      color: white;
      font-family: Arial;
      font-size: 0.8rem;
      height: 48px;
      line-height: 48px;
      padding: 0 12px;
      display: none;
    }
  </style>
</head>

<body>
  <div id="render-stats"></div>
  <canvas id="three-app-canvas"></canvas>

  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/utils/BufferGeometryUtils": "https://unpkg.com/three@0.155.0/examples/jsm/utils/BufferGeometryUtils.js",
        
        "three/examples/jsm/lines/Line2": "https://unpkg.com/three@0.155.0/examples/jsm/lines/Line2.js",
        "three/examples/jsm/lines/LineMaterial": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineMaterial.js",
        "three/examples/jsm/lines/LineGeometry": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineGeometry.js",
        "three/examples/jsm/lines/LineSegments2": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineSegments2.js",
        "three/examples/jsm/lines/LineSegmentsGeometry": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineSegmentsGeometry.js",

        "meshline": "https://unpkg.com/meshline@3.3.1/dist/index.js"
      }
    }
  </script>
  <script type="module" src="./index.js"></script>

  <!-- <div id="log" style="position: absolute; top: 0; left: 0; height: 300px; width: 300px; background: red;">aaaaa</div> -->
</body>

</html>
