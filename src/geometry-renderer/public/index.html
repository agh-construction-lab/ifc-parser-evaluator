<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Renderer</title>
  <link rel="icon" href="data:,">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1.5rem;
      padding: 12px 16px;
      border-radius: 8px;
      min-width: 200px;
    }

    #info-panel h3 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
    }

    #info-panel p {
      margin: 4px 0;
      color: rgba(255, 255, 255, 0.8);
    }

    #info-panel span {
      color: #4fc3f7;
      font-weight: 600;
    }

    #controls {
      position: fixed;
      bottom: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
    }

    #controls button {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.8rem;
    }

    #controls button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.4);
    }

    #controls button.active {
      background: #4fc3f7;
      color: #000;
      border-color: #4fc3f7;
    }
  </style>
</head>

<body>
  <div id="info-panel">
    <h3>Geometry Renderer</h3>
    <p>Entities: <span id="entity-count">0</span></p>
    <p>Vertices: <span id="vertex-count">0</span></p>
    <p>Triangles: <span id="triangle-count">0</span></p>
  </div>

  <!-- <div id="controls">
    <button onclick="window.setView('front')">Front</button>
    <button onclick="window.setView('left')">Left</button>
    <button onclick="window.setView('right')">Right</button>
    <button onclick="window.setView('top')">Top</button>
    <button onclick="window.setView('perspective')" class="active">3D</button>
  </div> -->

  <canvas id="canvas"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.155.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/utils/BufferGeometryUtils.js": "https://unpkg.com/three@0.155.0/examples/jsm/utils/BufferGeometryUtils.js",
        "three/examples/jsm/lines/LineSegments2.js": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineSegments2.js",
        "three/examples/jsm/lines/LineSegmentsGeometry.js": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineSegmentsGeometry.js",
        "three/examples/jsm/lines/LineMaterial.js": "https://unpkg.com/three@0.155.0/examples/jsm/lines/LineMaterial.js"
      }
    }
  </script>
  <script type="module" src="./index.js"></script>
</body>

</html>
